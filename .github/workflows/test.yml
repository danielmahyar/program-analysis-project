name: Test Suite
on: [push, pull_request]
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # The compiled classes and the decompiled bytecode (target/**/*.class and
  # target/**/*.json) are not in git. This job builds them with Docker, checks
  # that the committed case list, benchmark and OPCODES.md are up to date, and
  # hands the build to the test jobs.
  build:
    name: Build (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Verify Docker installation
        run: docker --version
      - name: Run build
        run: |
          uv run jpamb -vv build

          # Check if something was changed
          git diff --exit-code
      - name: Upload classes and decompiled bytecode
        uses: actions/upload-artifact@v4
        with:
          name: jpamb-target
          path: |
            target/classes
            target/decompiled
          if-no-files-found: error

  # The Windows leg runs the Python tool natively (checkhealth without docker +
  # pytest) against the build from the Linux job, so no Docker/WSL is required.
  python-tests:
    name: Python Tests (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Download classes and decompiled bytecode
        uses: actions/download-artifact@v4
        with:
          name: jpamb-target
          path: target
      - name: Run checkhealth
        run: |
          uv run jpamb -vv checkhealth
      - name: Run Python tests
        run: |
          uv run pytest
