[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "project-syntactic-confidentiality"
version = "0.1.0"
description = "Syntactic (AST) confidentiality analysis of the JPAMB security cases."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "jpamb",
  "tree-sitter>=0.26.0",
  "tree-sitter-java>=0.23.5",
]

[project.scripts]
project-syntactic-confidentiality = "syntactic_confidentiality:main"

[tool.uv.sources]
jpamb = { path = "../../", editable = true }

[dependency-groups]
dev = [
  "pytest>=9.1.1",
]
